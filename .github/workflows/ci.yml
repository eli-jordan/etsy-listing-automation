# PRs, main pushes and manual runs get hermetic Python/frontend gates,
# followed by browser tests over the built SPA. Real-service tests are
# explicitly excluded from the Python gate and belong to e2e.yml.
#
# The `e2e` layer lives in its own workflow ([e2e.yml](e2e.yml)) rather than
# here, because it is the one layer worth running on its own: it talks to real
# Printify and Etsy shops, it is the slowest thing in the repo, and its Etsy
# credentials expire in a way that needs re-running it by hand after a fix
# (see that file's note on refresh-token rotation). Splitting it means
# `gh workflow run e2e` re-runs it without also re-running lint, both test
# matrices and the browser layer.
#
# The gates mirror scripts/check.sh rather than calling it: that script is bash
# and reformats in place (`ruff format .`), neither of which suits a Windows
# runner. Change one, change the other.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Exercise every CI gate against a chosen ref.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    # Both platforms, deliberately. Development happens on Windows and the
    # render goldens were generated there; the exact OpenCV/Pillow pins exist so
    # the bytes come out the same everywhere. ubuntu is what proves that rather
    # than assuming it -- a golden that fails on one OS only is itself the
    # finding.
    name: python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: src/ui/package-lock.json

      # Editable sync reuses these assets; release wheels always rebuild.
      - name: build the calibrator frontend
        working-directory: src/ui
        run: npm ci && npm run build

      # Pinned exactly: setup-uv publishes no moving major tag past v7.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: install (locked)
        run: uv sync --frozen

      - name: ruff format
        run: uv run ruff format --check .

      - name: ruff check
        run: uv run ruff check .

      - name: mypy
        run: uv run mypy src

      # Core/server/CLI dependency direction (ADR-0052), contracts in pyproject.toml.
      - name: import-linter
        run: uv run lint-imports

      # An explicit -m replaces addopts: exclude both browser and e2e here.
      # This leaves unit, golden, behaviour and contract. The 85% branch floor comes from
      # `fail_under` in pyproject.toml, so this gate and a local `check.sh` can
      # never disagree about the number.
      - name: pytest + coverage (branch, fail under 85%)
        run: uv run pytest -m "not browser and not e2e" --cov --cov-report=term-missing

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/ui
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: src/ui/package-lock.json

      - name: install (locked)
        run: npm ci

      - name: prettier
        run: npm run format:check

      - name: eslint
        run: npm run lint

      - name: tsc
        run: npm run typecheck

      - name: vitest + coverage (branch, fail under 85%)
        run: npm run test:coverage

  browser:
    # Every trigger runs browsers after the Python and frontend gates.
    name: browser
    needs: [python, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: src/ui/package-lock.json

      # The browser layer serves the built SPA, so dist/ is a hard requirement
      # here -- without it `calibrator_server` skips every test in the layer.
      - name: build the calibrator frontend
        working-directory: src/ui
        run: npm ci && npm run build

      # Pinned exactly: setup-uv publishes no moving major tag past v7.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: install (locked)
        run: uv sync --frozen

      - name: install chromium
        run: uv run playwright install --with-deps chromium

      # The layer skips itself when a prerequisite is missing -- chromium, a
      # built SPA -- and a layer that runs nothing still reports green.
      # ETSY_LISTINGS_REQUIRE_EVERY_LAYER makes that a failure naming the
      # prerequisite, so this job cannot pass without doing its job.
      - name: pytest -m browser
        env:
          ETSY_LISTINGS_REQUIRE_EVERY_LAYER: "1"
        run: uv run pytest -m browser
