# PRs, main pushes and manual runs get hermetic Python/frontend gates and
# browser tests over the built SPA, all as parallel jobs. Real-service tests
# are explicitly excluded from the Python gate and belong to e2e.yml.
#
# The `e2e` layer lives in its own workflow ([e2e.yml](e2e.yml)) rather than
# here, because it is the one layer worth running on its own: it talks to real
# Printify and Etsy shops, it is the slowest thing in the repo, and its Etsy
# credentials expire in a way that needs re-running it by hand after a fix
# (see that file's note on refresh-token rotation). Splitting it means
# `gh workflow run e2e` re-runs it without also re-running lint, both test
# matrices and the browser layer.
#
# The Python steps call the check-only poe tasks in pyproject.toml, the same
# definitions `uv run poe check` runs locally (spec S09, S10), so the two
# cannot drift. Lint runs once, in `quality`; the two-OS matrix only tests.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Exercise every CI gate against a chosen ref.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    # Format, ruff, mypy, imports, complexipy, Vulture and jscpd (`poe lint`).
    # Their verdicts do not depend on the OS, so they run once, on ubuntu.
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24 # Node 26's global localStorage shadows jsdom's in Vitest (AGENTS.md)
          cache: npm
          cache-dependency-path: src/ui/package-lock.json

      - name: install frontend tools (locked)
        working-directory: src/ui
        run: npm ci

      # Pinned exactly: setup-uv publishes no moving major tag past v7.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: install (locked)
        run: uv sync --frozen

      - name: lint
        run: uv run poe lint

  python:
    # Both platforms, deliberately. Development happens on Windows and the
    # render goldens were generated there; the exact OpenCV/Pillow pins exist so
    # the bytes come out the same everywhere. ubuntu is what proves that rather
    # than assuming it -- a golden that fails on one OS only is itself the
    # finding.
    name: python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24 # Node 26's global localStorage shadows jsdom's in Vitest (AGENTS.md)
          cache: npm
          cache-dependency-path: src/ui/package-lock.json

      # The built SPA depends only on src/ui's sources and lockfile, which are
      # all that exists under src/ui before `npm ci` runs, so they key the cache.
      # A hit skips the ~1 min (~1.5 min on windows) install and build below.
      - name: restore the built calibrator frontend
        id: spa
        uses: actions/cache@v6
        with:
          path: src/ui/dist
          key: spa-${{ runner.os }}-${{ hashFiles('src/ui/**') }}

      # Editable sync reuses these assets; release wheels always rebuild.
      - name: build the calibrator frontend
        if: steps.spa.outputs.cache-hit != 'true'
        working-directory: src/ui
        run: npm ci && npm run build

      # Pinned exactly: setup-uv publishes no moving major tag past v7.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: install (locked)
        run: uv sync --frozen

      # `poe test-ci`: unit, golden, behaviour and contract; browser and e2e
      # excluded. The 85% branch floor comes from `fail_under` in
      # pyproject.toml, so this gate and a local `poe check` can never disagree
      # about the number.
      - name: pytest + coverage (branch, fail under 85%)
        run: uv run poe test-ci

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/ui
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24 # Node 26's global localStorage shadows jsdom's in Vitest (AGENTS.md)
          cache: npm
          cache-dependency-path: src/ui/package-lock.json

      - name: install (locked)
        run: npm ci

      - name: prettier
        run: npm run format:check

      - name: eslint
        run: npm run lint

      - name: tsc
        run: npm run typecheck

      - name: vitest + coverage (branch, fail under 85%)
        run: npm run test:coverage

      # Required, but outside production coverage: the prototype frames
      # import production components (vitest.config.ts's `design` project).
      - name: vitest design prototypes
        run: npm run test:design

  browser:
    # Alongside the other gates, not after them. Waiting for them put the
    # windows test job and this one end to end on the critical path (~21 min
    # in total); in parallel the run takes as long as its slowest job. A
    # broken push costs one more runner, and the concurrency group below
    # cancels a superseded run.
    name: browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24 # Node 26's global localStorage shadows jsdom's in Vitest (AGENTS.md)
          cache: npm
          cache-dependency-path: src/ui/package-lock.json

      # The built SPA depends only on src/ui's sources and lockfile, which are
      # all that exists under src/ui before `npm ci` runs, so they key the cache.
      # A hit skips the ~1 min (~1.5 min on windows) install and build below.
      - name: restore the built calibrator frontend
        id: spa
        uses: actions/cache@v6
        with:
          path: src/ui/dist
          key: spa-${{ runner.os }}-${{ hashFiles('src/ui/**') }}

      # The browser layer serves the built SPA, so dist/ is a hard requirement
      # here -- without it `calibrator_server` skips every test in the layer.
      - name: build the calibrator frontend
        if: steps.spa.outputs.cache-hit != 'true'
        working-directory: src/ui
        run: npm ci && npm run build

      # Pinned exactly: setup-uv publishes no moving major tag past v7.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: install (locked)
        run: uv sync --frozen

      - name: install chromium
        run: uv run playwright install --with-deps chromium

      # The layer skips itself when a prerequisite is missing -- chromium, a
      # built SPA -- and a layer that runs nothing still reports green.
      # ETSY_LISTINGS_REQUIRE_EVERY_LAYER makes that a failure naming the
      # prerequisite, so this job cannot pass without doing its job.
      # The opt-in `capture` screenshots stay out unless -m names them
      # (tests/conftest.py); `poe check`'s default selection agrees.
      - name: pytest -m browser (poe test-browser)
        env:
          ETSY_LISTINGS_REQUIRE_EVERY_LAYER: "1"
        run: uv run poe test-browser
