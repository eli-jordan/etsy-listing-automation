# Two tiers, split by what a layer needs from the outside world.
#
# Pull requests get the hermetic layers -- unit, golden, behaviour, contract --
# behind the same lint/type gates as `scripts/check.sh`, plus the coverage
# floor. None of that touches a network or a browser, so a PR cannot go red on
# somebody else's infrastructure.
#
# main gets the two expensive layers on top: `browser` (playwright over the
# built SPA served by FastAPI) and `e2e` (the real Printify catalog, via the
# repository's PRINTIFY_API_TOKEN secret). Phase 1's e2e tests are read-only
# GETs, so running them on every push to main costs no state.
#
# The gates mirror scripts/check.sh rather than calling it: that script is bash
# and reformats in place (`ruff format .`), neither of which suits a Windows
# runner. Change one, change the other.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Lets the main-only tier be run deliberately against a chosen ref -- the
  # only way to exercise it before merging, since a pull_request runs at
  # refs/pull/<n>/merge and the gate rightly excludes that.
  # `gh workflow run CI --ref <branch>` dispatches it from a branch.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    # Both platforms, deliberately. Development happens on Windows and the
    # render goldens were generated there; the exact OpenCV/Pillow pins exist so
    # the bytes come out the same everywhere. ubuntu is what proves that rather
    # than assuming it -- a golden that fails on one OS only is itself the
    # finding.
    name: python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: src/etsy_listings/ui/frontend/package-lock.json

      # Built before `uv sync` on purpose: hatch_build.py builds dist/ during
      # the editable install when it is absent, and does it with `npm install`.
      # Building first makes that hook a no-op, so every node install in CI
      # comes from package-lock.json.
      - name: build the calibrator frontend
        working-directory: src/etsy_listings/ui/frontend
        run: npm ci && npm run build

      # Pinned exactly: setup-uv publishes no moving major tag past v7.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: install (locked)
        run: uv sync --frozen

      - name: ruff format
        run: uv run ruff format --check .

      - name: ruff check
        run: uv run ruff check .

      - name: mypy
        run: uv run mypy src

      # `not browser` leaves unit, golden, behaviour and contract; `e2e` is
      # already excluded by pyproject's addopts. The 85% branch floor comes from
      # `fail_under` in pyproject.toml, so this gate and a local `check.sh` can
      # never disagree about the number.
      - name: pytest + coverage (branch, fail under 85%)
        run: uv run pytest -m "not browser" --cov --cov-report=term-missing

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/etsy_listings/ui/frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: src/etsy_listings/ui/frontend/package-lock.json

      - name: install (locked)
        run: npm ci

      - name: prettier
        run: npm run format:check

      - name: eslint
        run: npm run lint

      - name: tsc
        run: npm run typecheck

      - name: vitest + coverage (branch, fail under 85%)
        run: npm run test:coverage

  integration:
    # main, or a deliberate manual run. Gated on the ref rather than merely
    # on the event: `on.push`
    # is filtered to main today, so `event_name == 'push'` would be equivalent
    # -- but only by a coupling to a filter twelve lines away, and adding a
    # release branch there would silently start spending the Printify token on
    # it. A pull_request event runs at refs/pull/<n>/merge, so it cannot match.
    #
    # `needs` keeps these from burning ten minutes on a commit whose lint is
    # already broken.
    name: browser + e2e
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    needs: [python, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: src/etsy_listings/ui/frontend/package-lock.json

      # The browser layer serves the built SPA, so dist/ is a hard requirement
      # here -- without it `calibrator_server` skips every test in the layer.
      - name: build the calibrator frontend
        working-directory: src/etsy_listings/ui/frontend
        run: npm ci && npm run build

      # Pinned exactly: setup-uv publishes no moving major tag past v7.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: install (locked)
        run: uv sync --frozen

      - name: install chromium
        run: uv run playwright install --with-deps chromium

      # Both layers skip themselves when a prerequisite is missing -- chromium,
      # a built SPA, a Printify token -- and a layer that runs nothing still
      # reports green. ETSY_LISTINGS_REQUIRE_EVERY_LAYER makes that a failure
      # naming the prerequisite, so this tier cannot pass without doing its job.
      - name: pytest -m browser
        env:
          ETSY_LISTINGS_REQUIRE_EVERY_LAYER: "1"
        run: uv run pytest -m browser

      # Phase 3's Etsy e2e tests need a workspace that has already run `setup`
      # and `auth etsy` -- Etsy's OAuth handshake needs a real browser consent
      # step, so unlike the Printify token it cannot be a bare secret. This
      # materialises one from the stored token pair plus the (non-secret) shop
      # ids, in $RUNNER_TEMP so it never touches the checkout.
      #
      # Etsy rotates the refresh token on every use, and this workspace is
      # thrown away at the end of the job -- so the first run that needs a
      # refresh (the access token is typically good for ~1h) invalidates
      # ETSY_TOKENS_JSON for every run after it. There is no write-back here;
      # re-run `etsy-listings auth etsy` locally and update the secret when
      # that happens.
      - name: set up the Etsy e2e workspace
        env:
          ETSY_TOKENS_JSON: ${{ secrets.ETSY_TOKENS_JSON }}
        run: |
          workspace="$RUNNER_TEMP/etsy-e2e-workspace"
          mkdir -p "$workspace/.auth"
          {
            echo "printify:"
            echo "  shop_id: 28877318"
            echo "etsy:"
            echo "  shop_id: 67961328"
            echo "  currency: NOK"
          } > "$workspace/shop.yaml"
          printf '%s' "$ETSY_TOKENS_JSON" > "$workspace/.auth/etsy-tokens.json"
          echo "ETSY_LISTINGS_ROOT=$workspace" >> "$GITHUB_ENV"

      - name: pytest -m e2e
        env:
          ETSY_LISTINGS_REQUIRE_EVERY_LAYER: "1"
          PRINTIFY_API_TOKEN: ${{ secrets.PRINTIFY_API_TOKEN }}
          ETSY_KEYSTRING: ${{ secrets.ETSY_KEYSTRING }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
        run: uv run pytest -m e2e
