[build-system]
requires = ['hatchling==1.27.0']
build-backend = 'hatchling.build'

[project]
name = 'etsy-marigold-worker'
version = '1.0.0'
requires-python = '>=3.12,<3.13'
dependencies = [
  'torch==2.8.0', 'diffusers==0.35.1', 'transformers==4.56.2',
  'accelerate==1.10.1', 'huggingface-hub==0.35.1', 'numpy==2.2.6',
  'Pillow==10.4.0', 'safetensors==0.6.2', 'scipy==1.16.2',
]

[tool.hatch.build.targets.wheel]
packages = ['src/marigold_worker']

[[tool.uv.index]]
name = 'pytorch'
url = 'https://download.pytorch.org/whl/cu128'
explicit = true

[tool.uv.sources]
torch = { index = 'pytorch' }

[tool.uv]
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]
