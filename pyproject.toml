[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "etsy-listings"
version = "0.1.0"
description = "Automation that takes a print-on-demand t-shirt design from a file to a reviewable Etsy draft."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "typer>=0.19,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "httpx>=0.28,<1",
    "opencv-python-headless==4.10.0.84",
    "pillow==10.4.0",
    "pyyaml>=6.0,<7",
    "fastapi>=0.118,<1",
    # The calibrator's template-upload endpoint takes multipart form data.
    # FastAPI used to pull this in transitively; it no longer does, so it is
    # declared here as the direct requirement it has always really been.
    "python-multipart>=0.0.9,<1",
    "uvicorn[standard]>=0.38,<1",
    "questionary>=2.0,<3",
]

[project.scripts]
etsy-listings = "etsy_listings.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/etsy_listings"]

[tool.hatch.build]
# ui/frontend/dist/ is gitignored (built, not source) but must ship in the
# wheel -- hatchling excludes gitignored paths from artifacts by default.
artifacts = ["src/etsy_listings/ui/frontend/dist/**"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[dependency-groups]
dev = [
    "pytest>=8.2,<10",
    "pytest-cov>=6.0,<8",
    "mypy>=1.10,<2",
    "ruff>=0.14,<1",
    "types-pyyaml",
    "playwright>=1.49,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: exercises real Printify/Etsy APIs against a throwaway shop; skipped by default",
    "browser: drives the calibrator in a real browser via playwright; skipped when it is unavailable",
]
addopts = "-m 'not e2e'"

[tool.coverage.run]
source = ["src/etsy_listings"]
branch = true

[tool.coverage.report]
# Branch coverage, not line coverage: a half-tested `if` is the shape most
# regressions hide in. Currently ~85%, so the gate has real headroom -- if a
# change drops it under 80, that is a change that shipped untested logic, not
# a threshold to nudge downward.
fail_under = 80
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# ruff formats Python inside Markdown fences. docs/prd.md and
# docs/implementation-plan.md are authored documents whose snippets are
# deliberately laid out for reading (aligned comments, condensed dataclasses);
# reformatting them is noise in a diff that is supposed to record decisions.
extend-exclude = ["docs/**"]

[tool.ruff.lint]
select = [
    "E", "F", "W",     # pycodestyle / pyflakes
    "I",                # isort
    "B",                # bugbear
    "UP",               # pyupgrade
    "ANN",              # annotations
    "C4",               # comprehensions
    "SIM",              # simplify
]
ignore = [
    "ANN401",           # Any is sometimes the honest type at a boundary
    "B008",             # typer/fastapi require call-as-default (typer.Option(...))
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.ruff.lint.isort]
known-first-party = ["etsy_listings"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "cv2.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "questionary.*"
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
