[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "etsy-listings"
version = "0.1.0"
description = "Automation that takes a print-on-demand t-shirt design from a file to a reviewable Etsy draft."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "typer>=0.19,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "httpx>=0.28,<1",
    "opencv-python-headless==4.10.0.84",
    "pillow==10.4.0",
    "pyyaml>=6.0,<7",
    "fastapi>=0.118,<1",
    # The calibrator's template-upload endpoint takes multipart form data.
    # FastAPI used to pull this in transitively; it no longer does, so it is
    # declared here as the direct requirement it has always really been.
    "python-multipart>=0.0.9,<1",
    "uvicorn[standard]>=0.38,<1",
    "questionary>=2.0,<3",
    # ADR-0045's video gate reads a clip's duration, size and streams through
    # PyAV. Unlike OpenCV/Pillow it never produces bytes that get hashed, so a
    # floor pin is enough; its wheels bundle FFmpeg on every CI platform.
    "av>=15",
    # ADR-0055: writers edit seller YAML in place. ruamel's composer gives the
    # source spans those edits splice; PyYAML stays the reader.
    "ruamel.yaml>=0.19,<0.20",
    # One locked, byte-budgeted LRU (core/bounded_cache.py) holds every
    # in-process cache of decoded arrays; cachetools supplies the eviction.
    "cachetools>=7,<8",
]

[project.scripts]
etsy-listings = "etsy_listings.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/etsy_listings"]

# Wheels only: the hook rebuilds the npm project at frontend-dir and maps its
# gitignored dist/ to assets-dir inside the package, where the server finds it
# once installed. The sdist carries the npm source, lockfile and this hook
# instead (node_modules/ and dist/ stay out as gitignored), so building a
# wheel from it rebuilds the same assets.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"
frontend-dir = "src/ui"
assets-dir = "etsy_listings/server/static"

[dependency-groups]
dev = [
    "pytest>=8.2,<10",
    "pytest-cov>=6.0,<8",
    "mypy>=1.10,<2",
    "ruff>=0.14,<1",
    "types-pyyaml",
    "playwright>=1.49,<2",
    "import-linter>=2.15,<3",
    "poethepoet>=0.37,<1",
    "vulture>=2.14,<3",
    "complexipy>=8.0,<9",
    "types-cachetools>=7,<8",
    "pytest-xdist>=3.6,<4",
]

# Every check is defined once, here (spec S09). `uv run poe check` is what you
# run before committing: it fixes and formats in place, then runs every gate.
# CI calls the check-only tasks (`lint`, `test-ci`, `test-browser`).
[tool.poe]
# A developer who works on a real workspace exports ETSY_LISTINGS_ROOT, and
# `Workspace.discover()` consults it before walking up from cwd. The workspace
# tests would then discover *that* workspace instead of their fixture copy,
# and fail for a reason unrelated to the change being checked. The checks
# should not depend on any workspace, so every task clears it: poe cannot
# unset a variable, and both `discover()` and Typer's envvar treat an empty
# value as absent. Tests that want it set it themselves; the only layer that
# reads it from the environment is `-m e2e`, which no task here runs.
env = { ETSY_LISTINGS_ROOT = "" }

[tool.poe.tasks]
format = "ruff format ."
format-check = "ruff format --check ."
# Applies what it can and never fails; `ruff` afterwards reports the rest.
fix = "ruff check --fix --exit-zero --quiet ."
ruff = "ruff check ."
mypy = "mypy src"
# Core/server/CLI dependency direction and protected application modules
# (ADR-0052); contracts below.
imports = "lint-imports"
# S04/S05: whole-program checks use application source only.
dead-code = "vulture src/etsy_listings --min-confidence 90"
duplicates = "node src/ui/node_modules/jscpd/bin/jscpd src/etsy_listings src/ui/src --config .jscpd.json"
# S02: cognitive complexity per function; paths and limit in [tool.complexipy].
complexity = "complexipy --failed --plain"
# The `quality` CI job: report only, change nothing.
lint = ["format-check", "ruff", "mypy", "imports", "complexity", "dead-code", "duplicates"]
# Coverage is measured over the whole default selection, browser layer
# included. Those tests skip themselves when chromium or src/ui/dist is
# missing, which costs about a point; the 85% floor (`fail_under`, below) has
# the headroom to pass either way. The opt-in `capture` screenshots are
# deselected by tests/conftest.py, as in CI's browser job.
#
# Every suite task runs under pytest-xdist: `-n auto` starts one worker per
# core and `worksteal` hands a long test's neighbours to idle workers, which
# matters because a few tests (agent lint, Marigold preview detail) run for
# 20-50s each. Serially the hermetic layers took ~13 min on a 10-core machine;
# in parallel, with coverage, ~3.5 min. pytest-cov combines the workers'
# data, so the floor is judged on the whole run. Tests must therefore not
# share mutable state across files: use tmp_path and _free_port(), as the
# fixtures in tests/conftest.py and tests/browser/conftest.py do. A plain
# `pytest <file>` stays serial, since workers cost more than they save there.
test = "pytest -n auto --dist worksteal --cov --cov-report=term-missing --cov-report=html"
# The CI matrix: an explicit -m replaces addopts, excluding browser and e2e.
# That leaves unit, golden, behaviour and contract, under the same floor.
test-ci = "pytest -m 'not browser and not e2e' -n auto --dist worksteal --cov --cov-report=term-missing"
# CI's windows leg: the same selection, without coverage (ci.yml says why).
test-ci-nocov = "pytest -m 'not browser and not e2e' -n auto --dist worksteal"
test-browser = "pytest -m browser -n auto --dist worksteal"
# `npm run format` writes, as `ruff format .` does; CI's frontend job runs
# `format:check`. `test:design` runs the marver prototype frames' tests:
# required, but a separate Vitest project outside production coverage.
# Skipped, not failed, when npm is not on PATH.
frontend = "python scripts/frontend_gate.py format lint typecheck test:coverage test:design"
# Fix, then format (so a fix's output is formatted and E501 is judged on
# formatted lines), then report what is left. The gates run one after another
# on purpose: `test` already keeps every core busy, so running lint and the
# frontend beside it measured no faster (~6.5 min either way) and pushed the
# slowest subprocess tests past their timeouts.
check = ["fix", "format", "lint", "test", "frontend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repo root, so `tests.support` (shared builders and prompt doubles) and
# `tests.core.contract` (whose payload transcripts the e2e layer re-checks against
# the live API) are importable from any layer. `tests/` is deliberately not a
# package -- the owner/layer directories stay plain -- so they resolve as namespace
# packages off the root, which is what this puts on `sys.path`.
pythonpath = ["."]
markers = [
    "e2e: exercises real Printify/Etsy APIs against a throwaway shop; skipped by default",
    "browser: drives the calibrator in a real browser via playwright; skipped when it is unavailable",
    "capture: opt-in screenshot artifacts for human review; run only when -m names capture",
]
addopts = "-m 'not e2e'"

[tool.coverage.run]
source = ["src/etsy_listings"]
branch = true

[tool.coverage.report]
# Branch coverage, not line coverage: a half-tested `if` is the shape most
# regressions hide in. Currently ~93%, so the gate has real headroom -- if a
# change drops it under 85, that is a change that shipped untested logic, not
# a threshold to nudge downward.
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# ruff formats Python inside Markdown fences. docs/history/prd.md and
# docs/history/implementation-plan.md are authored documents whose snippets are
# deliberately laid out for reading (aligned comments, condensed dataclasses);
# reformatting them is noise in a diff that is supposed to record decisions.
extend-exclude = ["docs/**"]

[tool.ruff.lint]
select = [
    "E", "F", "W",     # pycodestyle / pyflakes
    "I",                # isort
    "B",                # bugbear
    "UP",               # pyupgrade
    "ANN",              # annotations
    "C4",               # comprehensions
    "SIM",              # simplify
    # S01 mechanical families.
    "RET", "PIE", "RSE",
    "PERF", "FURB",
    "PTH",
    "RUF",
    "PGH",
    "BLE",
    "ERA",
    "A",
    "DTZ",
    "T20",
    "FAST",
    "PT",
    "TRY",
    "PLE", "PLW",
    "N",
    # S01 judgment families.
    "FBT",
    "ARG",
    "SLF",
    "PLC0415",
    "PLR2004",
    "PLR0913", "PLR0917",
    # S02 complexity and size limits, tests included.
    "C90",
    "PLR0911", "PLR0912", "PLR0915",
]
ignore = [
    "ANN401",           # Any is sometimes the honest type at a boundary
    "B008",             # typer/fastapi require call-as-default (typer.Option(...))
    "RUF001",           # S01: the code uses × and – on purpose
    "RUF002",
    "RUF003",
    "TRY003",           # S01: exception message style has no quality gain
]

[tool.ruff.lint.per-file-ignores]
# S01: tests compare against literal expectations, stub interfaces with unused
# parameters, inspect the subject's internals, pass booleans to helpers, import
# lazily, print diagnostics and build fixtures with many parameters.
"tests/**" = ["ANN", "PLR2004", "ARG", "SLF001", "FBT003", "PLC0415", "T20", "PLR0913"]
# S01: print is the interface of the CLI and of scripts/. Production code
# elsewhere logs, or renders through the CLI.
"src/etsy_listings/cli/**" = ["T20"]
"scripts/**" = ["T20"]
# S06: the Codex gate decides on every shell command; os.path and open() spare
# the 10ms pathlib import, about 6% of its skip path.
"scripts/agent_lint_gate.py" = ["T20", "PTH"]

[tool.ruff.lint.pylint]
# S02: never loosened to make a check pass.
max-args = 5
max-positional-args = 5
max-returns = 6
max-branches = 12
max-statements = 50

[tool.ruff.lint.mccabe]
# S02: cyclomatic complexity, never loosened to make a check pass.
max-complexity = 8

[tool.complexipy]
# S02: cognitive complexity over all first-party Python. `poe complexity`
# and the edit hook (scripts/agent_lint.py) both read this.
paths = ["src", "tests", "scripts"]
max-complexity-allowed = 10
# Vendored packages' own scripts, not ours to judge.
exclude = ["**/node_modules/**"]

[tool.ruff.lint.isort]
known-first-party = ["etsy_listings"]
# `tests.support` is shared test scaffolding, not a dependency and not part of
# the package. Its own section keeps it below the imports of the thing under
# test, where it reads as scaffolding rather than as another module of the app.
known-local-folder = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "cv2.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "questionary.*"
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# Dependency direction between core, server and CLI (ADR-0052; the
# module-structure spec's Import Linter table). Forbidden contracts are checked
# transitively, and an ignored import that no longer exists is reported, so a
# temporary exclusion cannot outlive the code it excuses. Every temporary
# exclusion names the PR of docs/features/module-structure-20260930/plan.md
# that removes it; none may survive PR 11. `uv run lint-imports` runs in
# `poe check` and CI's `quality` job; tests/test_import_contracts.py proves these
# contracts reject representative violations.
#
# Wizard sequencing, prompts and terminal output are all under etsy_listings.cli
# (plan, PR 10), so forbidding cli covers them; their reusable operations are
# in core and bound by core's contract.
[tool.importlinter]
root_packages = ["etsy_listings"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Core is transport-independent: no server, CLI (wizards, prompts, terminal) or framework imports"
type = "forbidden"
source_modules = ["etsy_listings.core"]
forbidden_modules = [
    "etsy_listings.server",
    "etsy_listings.cli",
    "fastapi",
    "starlette",
    "uvicorn",
    "typer",
    "questionary",
]

[[tool.importlinter.contracts]]
name = "Server does not depend on the CLI, including its wizards, prompts and terminal adapters"
type = "forbidden"
source_modules = ["etsy_listings.server"]
forbidden_modules = [
    "etsy_listings.cli",
    "typer",
    "questionary",
]

[[tool.importlinter.contracts]]
name = "Only the CLI ui launcher reaches the server, through its startup interface"
type = "forbidden"
source_modules = ["etsy_listings.cli"]
forbidden_modules = ["etsy_listings.server", "fastapi", "starlette", "uvicorn"]
ignore_imports = [
    # Permanent and intended: the one CLI-to-server edge (ADR-0052; plan, PR 5).
    # A single edge rather than an exemption for the cli package, and a
    # forbidden contract rather than CLI/server independence, which would
    # reject this intentional path. cli.app registering the command reaches it
    # indirectly, which the ignore permits; any other route to server breaks.
    "etsy_listings.cli.ui -> etsy_listings.server.hosting",
]

# Protected implementation (ADR-0052; module-structure spec, "Application
# callers cannot bypass protected implementation modules"). core.application
# is imported module by module, with no core-wide facade; each package
# __init__.py lists its public modules and names the implementation-only ones
# below. Only the coordinator a module serves may import it -- not server, not
# the CLI, not another operation and not a package initializer. Tests are
# outside this graph; tests/test_protected_test_imports.py reads these
# contracts and lets only a module's own tests import it.

[[tool.importlinter.contracts]]
name = "Deployment runs are reached through Deployments, not its worker or review check"
type = "protected"
protected_modules = [
    "etsy_listings.core.application.deploy.executor",
    "etsy_listings.core.application.deploy.review",
]
allowed_importers = ["etsy_listings.core.application.deploy.deployments"]
as_packages = false

[[tool.importlinter.contracts]]
name = "AI runs are reached through AiCoordinator, not the thread that runs them"
type = "protected"
protected_modules = ["etsy_listings.core.application.ai.runner"]
allowed_importers = [
    "etsy_listings.core.application.ai.coordinator",
    # The queue drafts batch rows through the same runs (ADR-0048).
    "etsy_listings.core.application.ai.batch_queue",
]
as_packages = false

# The isolated worker is checked without installing its model dependencies in
# the application environment. They are complete and pinned in distribution/uv.lock.
[[tool.mypy.overrides]]
module = ["torch.*", "diffusers.*", "huggingface_hub.*", "psutil.*"]
ignore_missing_imports = true

[[tool.importlinter.contracts]]
name = "CPU rendering and prediction loading never reach model installation or inference"
type = "forbidden"
source_modules = [
    "etsy_listings.core.render",
    "etsy_listings.core.preparation.predictions",
    "etsy_listings.core.preparation.artifacts",
    "etsy_listings.core.preparation.numerics",
]
forbidden_modules = [
    "etsy_listings.core.preparation.runtime",
    "etsy_listings.core.preparation.installation",
    "etsy_listings.core.preparation.worker_client",
    "etsy_listings.core.preparation.distribution",
    "torch",
    "diffusers",
]

[[tool.importlinter.contracts]]
name = "Native installation is reached through the explicit Runtime interface"
type = "protected"
protected_modules = ["etsy_listings.core.preparation.installation"]
allowed_importers = ["etsy_listings.core.preparation.runtime"]
as_packages = false

[[tool.importlinter.contracts]]
name = "Material fitting is reached through pure preparation"
type = "protected"
protected_modules = ["etsy_listings.core.preparation._geometry"]
allowed_importers = ["etsy_listings.core.preparation.numerics"]
as_packages = false

[[tool.importlinter.contracts]]
name = "Material numerical helpers belong to CPU fitting and composition"
type = "protected"
protected_modules = ["etsy_listings.core.render._material_math"]
allowed_importers = [
    "etsy_listings.core.render.material",
    "etsy_listings.core.preparation.numerics",
    "etsy_listings.core.preparation._geometry",
]
as_packages = false

[[tool.importlinter.contracts]]
name = "Preparation jobs go through Preparations"
type = "protected"
protected_modules = [
    "etsy_listings.core.application.preparation.execution",
    "etsy_listings.core.application.preparation.store",
]
allowed_importers = ["etsy_listings.core.application.preparation.coordinator"]
as_packages = false

[[tool.importlinter.contracts]]
name = "Preparation prediction retention belongs to job execution"
type = "protected"
protected_modules = ["etsy_listings.core.application.preparation.evidence"]
allowed_importers = ["etsy_listings.core.application.preparation.execution"]
as_packages = false
