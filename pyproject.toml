[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "etsy-listings"
version = "0.1.0"
description = "Automation that takes a print-on-demand t-shirt design from a file to a reviewable Etsy draft."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "typer>=0.12,<0.13",
    "click>=8.1,<8.2",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "httpx>=0.27,<0.28",
    "opencv-python-headless==4.10.0.84",
    "pillow==10.4.0",
    "pyyaml>=6.0,<7",
    "fastapi>=0.111,<0.112",
    "uvicorn[standard]>=0.30,<0.31",
    "questionary>=2.0,<3",
]

[project.scripts]
etsy-listings = "etsy_listings.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/etsy_listings"]

[dependency-groups]
dev = [
    "pytest>=8.2,<9",
    "pytest-cov>=5.0,<6",
    "mypy>=1.10,<2",
    "ruff>=0.5,<0.6",
    "types-pyyaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: exercises real Printify/Etsy APIs against a throwaway shop; skipped by default",
]
addopts = "-m 'not e2e'"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",     # pycodestyle / pyflakes
    "I",                # isort
    "B",                # bugbear
    "UP",               # pyupgrade
    "ANN",              # annotations
    "C4",               # comprehensions
    "SIM",              # simplify
]
ignore = [
    "ANN401",           # Any is sometimes the honest type at a boundary
    "ANN101",           # self does not need an annotation
    "ANN102",           # cls does not need an annotation
    "B008",             # typer/fastapi require call-as-default (typer.Option(...))
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.ruff.lint.isort]
known-first-party = ["etsy_listings"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "cv2.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "questionary.*"
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
